[project]
name = "seoji"
version = "0.1.0"
description = "Korean book bibliographic database built from NLK LOD and Seoji API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.27",
    "mcp>=2.3.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.2",
    "pyoxigraph>=0.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
seoji = "seoji.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seoji"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
